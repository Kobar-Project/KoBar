name: Mac Build

# Manual only. This workflow checks that an unsigned macOS package builds; it never publishes and uploads no artifacts (Actions storage quota).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      run: npm ci

    # T-217: dist:mac compiles (KOBAR_FLAVOR=direct) and packages with electron-builder.config.cjs and --publish never.
    - name: Compile and package for macOS (no publish)
      run: npm run dist:mac
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # Unsigned CI builds must never self-update.
        KOBAR_AUTO_UPDATE: "false"
